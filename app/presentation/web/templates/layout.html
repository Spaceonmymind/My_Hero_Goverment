<!-- app/presentation/web/templates/layout.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ page_title }} — Мой Герой</title>

  <link rel="stylesheet" href="/static/css/app.css"/>
  <script defer src="/static/js/app.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const auth = params.get("auth") || sessionStorage.getItem("mh_auth");
      if (!auth) return;

      sessionStorage.setItem("mh_auth", auth);

      const withAuth = (value) => {
        const url = new URL(value, window.location.origin);
        if (url.origin !== window.location.origin) return value;
        if (url.pathname.startsWith("/static/") || url.pathname.startsWith("/uploads/")) return value;
        url.searchParams.set("auth", auth);
        return url.pathname + url.search + url.hash;
      };

      document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("a[href^='/']").forEach((link) => {
          link.setAttribute("href", withAuth(link.getAttribute("href")));
        });
        document.querySelectorAll("form[action^='/']").forEach((form) => {
          form.setAttribute("action", withAuth(form.getAttribute("action")));
        });
      });
    })();
  </script>
</head>

<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  {% include "components/_nav.html" %}

  <main class="container">
    <div class="page-head reveal">
      <div class="page-title">
        <h1>{{ page_title }}</h1>
      </div>

      <div class="page-actions">
        {% if user %}
          <form method="post" action="/auth/logout">
            <button class="btn btn-primary" type="submit">Выйти</button>
          </form>
        {% else %}
          <a class="btn btn-primary" href="/auth/login">Войти</a>
        {% endif %}
      </div>
    </div>

    {% block content %}{% endblock %}
  </main>

  {% include "components/_toast.html" %}
</body>
</html>
